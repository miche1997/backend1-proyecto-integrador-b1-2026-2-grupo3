<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
  <title>Sistema de Inventario</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
      font-family: system-ui, "Segoe UI", sans-serif; color: #333; background: #f5f6f8;
    }
    .rueda {
      width: 44px; height: 44px; border-radius: 50%;
      border: 4px solid #d6dbe3; border-top-color: #1a73e8;
      animation: girar 0.9s linear infinite;
    }
    @keyframes girar { to { transform: rotate(360deg); } }
    p { margin: 0; color: #666; }
  </style>
</head>
<body>
  <div class="rueda"></div>
  <h2 style="margin:0">Sistema de Inventario</h2>
  <p>Iniciando el servidor, puede tardar unos segundos…</p>
</body>
</html>
