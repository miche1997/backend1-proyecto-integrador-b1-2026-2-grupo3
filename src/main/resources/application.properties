server.port=${PORT:8080}
logging.level.org.atmosphere=warn

# Launch the default browser when starting the application in development mode
vaadin.launch-browser=true

# To improve the performance during development.
# For more information https://vaadin.com/docs/latest/flow/integrations/spring/configuration#special-configuration-parameters
vaadin.allowed-packages=com.vaadin,org.vaadin,com.flowingcode,com.example

# ==========================================
# Configuración Base de Datos PostgreSQL
# ==========================================
# Orden: DB_URL/DB_USERNAME/DB_PASSWORD -> Neon (DATABASE_URL en .env.local) -> PostgreSQL local
spring.datasource.url=${DB_URL:${NEON_JDBC_URL:jdbc:postgresql://localhost:5432/inventario_db}}
spring.datasource.username=${DB_USERNAME:${NEON_DB_USERNAME:postgres}}
spring.datasource.password=${DB_PASSWORD:${NEON_DB_PASSWORD:postgres}}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# Configuración ORM Hibernate / JPA
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

